name: test

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  minimum-perl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Perl 5.36
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.36'
          enable-modules-cache: false

      - name: Verify Perl version
        run: |
          perl -v
          perl -e 'die "Expected Perl 5.36\n" unless $^V =~ /^v5\.36\./'

      - name: Install distribution prerequisites
        run: cpanm --notest --installdeps .

      - name: Run development tests on Perl 5.36
        run: bin/test-dev

      - name: Build and install distribution on Perl 5.36
        run: |
          prefix="$RUNNER_TEMP/test-slim-perl-5.36"
          perl Build.PL --install_base="$prefix"
          ./Build
          ./Build install

      - name: Smoke-test installed Perl 5.36 pipe service
        run: |
          set -o pipefail
          prefix="$RUNNER_TEMP/test-slim-perl-5.36"
          printf '000003:bye' \
            | PERL5LIB="$prefix/lib/perl5" "$prefix/bin/perl-slim" 1 \
            | perl -0777 -ne 'exit($_ eq "Slim -- V0.5\n" ? 0 : 1)'

  macos:
    name: macOS Perl 5.36 portability
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Set up Perl 5.36
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.36'
          enable-modules-cache: false

      - name: Verify Perl version
        run: |
          perl -v
          perl -e 'die "Expected Perl 5.36\n" unless $^V =~ /^v5\.36\./'

      - name: Install distribution prerequisites
        run: cpanm --notest --installdeps .

      - name: Run Perl development tests
        run: bin/test-dev

      - name: Set up Java for the installed FitNesse smoke test
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned FitNesse JAR
        run: |
          curl --fail --location --retry 3 \
            https://github.com/unclebob/fitnesse/releases/download/v20251025/fitnesse-20251025-standalone.jar \
            -o "$RUNNER_TEMP/fitnesse.jar"
          echo '824596f90381a9637abd4d5b2aa0f4f03f2ef5e5716399c41b2ae8889d470d11  '"$RUNNER_TEMP/fitnesse.jar" | shasum -a 256 -c -

      - name: Build, install, and smoke-test the installed distribution
        env:
          FITNESSE_JAR: ${{ runner.temp }}/fitnesse.jar
        run: bin/test-install

  windows:
    name: Strawberry Perl 5.36 portability
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Strawberry Perl 5.36
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.36'
          distribution: strawberry
          enable-modules-cache: false

      - name: Verify Perl distribution
        shell: pwsh
        run: |
          perl -v
          perl -e 'die "Expected Perl 5.36\n" unless $^V =~ /^v5\.36\./'

      - name: Install distribution prerequisites
        shell: pwsh
        run: cpanm --notest --installdeps .

      - name: Verify IPC::Run subprocess API
        shell: pwsh
        run: |
          perl -MIPC::Run -e 'print "IPC::Run $IPC::Run::VERSION ($INC{q(IPC/Run.pm)})\n"; IPC::Run->VERSION("20260322.0"); for my $method (qw(finished pump_nb kill_kill)) { die "IPC::Run $IPC::Run::VERSION lacks $method\n" unless IPC::Run->can($method) }'
          if ($LASTEXITCODE -ne 0) { throw "IPC::Run 20260322.0 subprocess API preflight failed: $LASTEXITCODE" }

      - name: Load the new namespace and build the distribution
        shell: pwsh
        run: |
          $env:PERL5LIB = (Join-Path $PWD 'lib')
          perl -MTest::FitNesse::Slim -e 'die "wrong version" unless $Test::FitNesse::Slim::VERSION eq "1.00"'
          perl Build.PL
          if ($LASTEXITCODE -ne 0) { throw "Build.PL failed: $LASTEXITCODE" }
          perl Build
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }

      - name: Verify checkout pipe and TCP sessions with Perl
        shell: pwsh
        run: |
          perl -Ilib -Iexamples/lib t/portable-transport-smoke.t
          $portableStatus = $LASTEXITCODE
          if ($portableStatus -ne 0) { throw "Checkout transport smoke failed: $portableStatus" }

      - name: Run focused Perl and TCP tests
        shell: pwsh
        timeout-minutes: 5
        run: |
          Write-Host 'SKIPPED: t/server-concurrency.t'
          Write-Host 'Reason: concurrent TCP/fork behavior is not validated on Windows.'
          $failed = @()
          foreach ($test in @('t/00-load.t', 't/list-serializer.t', 't/typed-sequence-converters.t', 't/server-bind-address.t')) {
            Write-Host "Running $test"
            prove --lib $test
            $status = $LASTEXITCODE
            if ($status -ne 0) {
              $failed += "$test (exit $status)"
              Write-Host "FAILED: $test (exit $status)"
            }
            else { Write-Host "PASSED: $test" }
          }
          if ($failed.Count -gt 0) { throw "Windows focused tests failed: $($failed -join ', ')" }

      - name: Install and smoke-test both installed transports
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'test-fitnesse-slim'
          perl Build.PL "--install_base=$prefix"
          if ($LASTEXITCODE -ne 0) { throw "Build.PL install configuration failed: $LASTEXITCODE" }
          perl Build
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }
          perl Build install
          if ($LASTEXITCODE -ne 0) { throw "Build install failed: $LASTEXITCODE" }
          $modulePath = Join-Path $prefix 'lib/perl5'
          $fixturePath = Join-Path $PWD 'examples/lib'
          $runner = Join-Path $prefix 'bin/perl-slim'
          perl "-I$modulePath" "-I$fixturePath" t/portable-transport-smoke.t `
            --runner $runner --module-dir $modulePath --fixture-dir $fixturePath `
            --install-prefix $prefix
          $status = $LASTEXITCODE
          if ($status -ne 0) { throw "Installed pipe/TCP smoke failed: $status" }

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Build CI image
        id: build_image
        run: |
          docker build \
            --build-arg FITNESSE_VERSION=20251025 \
            --build-arg FITNESSE_SHA256=824596f90381a9637abd4d5b2aa0f4f03f2ef5e5716399c41b2ae8889d470d11 \
            -f .devcontainer/Dockerfile \
            -t test-slim-ci \
            .

      - name: Run Perl and FitNesse acceptance tests in container
        run: |
          docker run --rm \
            -e LANG=C.UTF-8 \
            -e LC_ALL=C.UTF-8 \
            -v "$PWD":/workspaces/test-slim \
            -w /workspaces/test-slim \
            test-slim-ci \
            bash -lc 'bin/report-fitnesse-coverage && bin/test-dev && bin/test-fitnesse'

      - name: Validate documentation and installed distribution
        run: |
          docker run --rm \
            -e LANG=C.UTF-8 \
            -e LC_ALL=C.UTF-8 \
            -v "$PWD":/workspaces/test-slim \
            -w /workspaces/test-slim \
            test-slim-ci \
            bash -lc 'bin/check-docs && prove -v t/pod.t t/pod-coverage.t && bin/test-install'

      - name: Run native FitNesse suite against Perl
        run: |
          docker run --rm \
            -e LANG=C.UTF-8 \
            -e LC_ALL=C.UTF-8 \
            -v "$PWD":/workspaces/test-slim \
            -w /workspaces/test-slim \
            test-slim-ci \
            bash -lc 'bin/test-fitnesse-suite'

      - name: Run TCP FitNesse regression gates
        run: |
          docker run --rm \
            -e LANG=C.UTF-8 \
            -e LC_ALL=C.UTF-8 \
            -v "$PWD":/workspaces/test-slim \
            -w /workspaces/test-slim \
            test-slim-ci \
            bash -lc 'bin/test-fitnesse --transport tcp && bin/test-fitnesse-suite --transport tcp'

      - name: Run installed order-management example suite
        run: |
          docker run --rm \
            -e LANG=C.UTF-8 \
            -e LC_ALL=C.UTF-8 \
            -v "$PWD":/workspaces/test-slim \
            -w /workspaces/test-slim \
            test-slim-ci \
            bash -lc 'bin/test-example-order-management'

      - name: Report the four acceptance configurations
        if: ${{ always() && steps.build_image.outcome == 'success' }}
        run: |
          docker run --rm \
            -e LANG=C.UTF-8 \
            -e LC_ALL=C.UTF-8 \
            -v "$PWD":/workspaces/test-slim \
            -w /workspaces/test-slim \
            test-slim-ci \
            bash -lc 'bin/report-fitnesse-matrix'
