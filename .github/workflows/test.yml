name: test

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  minimum-perl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Perl 5.36
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.36'

      - name: Verify Perl version
        run: |
          perl -v
          perl -e 'die "Expected Perl 5.36\n" unless $^V =~ /^v5\.36\./'

      - name: Install distribution prerequisites
        run: cpanm --notest --installdeps .

      - name: Run development tests on Perl 5.36
        run: bin/test-dev

      - name: Build and install distribution on Perl 5.36
        run: |
          prefix="$RUNNER_TEMP/test-slim-perl-5.36"
          perl Build.PL --install_base="$prefix"
          ./Build
          ./Build install

      - name: Smoke-test installed Perl 5.36 pipe service
        run: |
          set -o pipefail
          prefix="$RUNNER_TEMP/test-slim-perl-5.36"
          printf '000003:bye' \
            | PERL5LIB="$prefix/lib/perl5" "$prefix/bin/perl-slim" 1 \
            | perl -0777 -ne 'exit($_ eq "Slim -- V0.5\n" ? 0 : 1)'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Build CI image
        id: build_image
        run: |
          docker build \
            --build-arg FITNESSE_VERSION=20251025 \
            --build-arg FITNESSE_SHA256=824596f90381a9637abd4d5b2aa0f4f03f2ef5e5716399c41b2ae8889d470d11 \
            -f .devcontainer/Dockerfile \
            -t test-slim-ci \
            .

      - name: Run Perl and FitNesse acceptance tests in container
        run: |
          docker run --rm \
            -e LANG=C.UTF-8 \
            -e LC_ALL=C.UTF-8 \
            -v "$PWD":/workspaces/test-slim \
            -w /workspaces/test-slim \
            test-slim-ci \
            bash -lc 'bin/report-fitnesse-coverage && bin/test-dev && bin/test-fitnesse'

      - name: Validate documentation and installed distribution
        run: |
          docker run --rm \
            -e LANG=C.UTF-8 \
            -e LC_ALL=C.UTF-8 \
            -v "$PWD":/workspaces/test-slim \
            -w /workspaces/test-slim \
            test-slim-ci \
            bash -lc 'bin/check-docs && prove -v t/pod.t t/pod-coverage.t && bin/test-install'

      - name: Run native FitNesse suite against Perl
        run: |
          docker run --rm \
            -e LANG=C.UTF-8 \
            -e LC_ALL=C.UTF-8 \
            -v "$PWD":/workspaces/test-slim \
            -w /workspaces/test-slim \
            test-slim-ci \
            bash -lc 'bin/test-fitnesse-suite'

      - name: Run TCP FitNesse regression gates
        run: |
          docker run --rm \
            -e LANG=C.UTF-8 \
            -e LC_ALL=C.UTF-8 \
            -v "$PWD":/workspaces/test-slim \
            -w /workspaces/test-slim \
            test-slim-ci \
            bash -lc 'bin/test-fitnesse --transport tcp && bin/test-fitnesse-suite --transport tcp'

      - name: Run installed order-management example suite
        run: |
          docker run --rm \
            -e LANG=C.UTF-8 \
            -e LC_ALL=C.UTF-8 \
            -v "$PWD":/workspaces/test-slim \
            -w /workspaces/test-slim \
            test-slim-ci \
            bash -lc 'bin/test-example-order-management'

      - name: Report the four acceptance configurations
        if: ${{ always() && steps.build_image.outcome == 'success' }}
        run: |
          docker run --rm \
            -e LANG=C.UTF-8 \
            -e LC_ALL=C.UTF-8 \
            -v "$PWD":/workspaces/test-slim \
            -w /workspaces/test-slim \
            test-slim-ci \
            bash -lc 'bin/report-fitnesse-matrix'
