name: test

on:
  push:
  pull_request:

jobs:
  perl-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Build CI image
        run: |
          docker build \
            --build-arg FITNESSE_VERSION=20251025 \
            --build-arg FITNESSE_SHA256=824596f90381a9637abd4d5b2aa0f4f03f2ef5e5716399c41b2ae8889d470d11 \
            -f .devcontainer/Dockerfile \
            -t test-slim-ci \
            .

      - name: Run developer tests in container
        run: |
          docker run --rm \
            -e LANG=C.UTF-8 \
            -e LC_ALL=C.UTF-8 \
            -v "$PWD":/workspaces/test-slim \
            -w /workspaces/test-slim \
            test-slim-ci \
            bin/test-dev
