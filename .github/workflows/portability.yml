name: Exploratory Windows portability

on:
  workflow_dispatch:

jobs:
  windows:
    name: Strawberry Perl 5.36 exploratory checks
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Strawberry Perl 5.36
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.36'
          distribution: strawberry
          enable-modules-cache: false

      - name: Verify Perl distribution
        shell: pwsh
        run: |
          perl -v
          perl -e 'die "Expected Perl 5.36\n" unless $^V =~ /^v5\.36\./'

      - name: Install distribution prerequisites
        shell: pwsh
        run: cpanm --notest --installdeps .

      - name: Load the new namespace and build the distribution
        shell: pwsh
        run: |
          $env:PERL5LIB = (Join-Path $PWD 'lib')
          perl -MTest::FitNesse::Slim -e 'die "wrong version" unless $Test::FitNesse::Slim::VERSION eq "1.00"'
          perl Build.PL
          if ($LASTEXITCODE -ne 0) { throw "Build.PL failed: $LASTEXITCODE" }
          perl Build
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }

      - name: Verify checkout pipe and TCP sessions with Perl
        shell: pwsh
        run: |
          perl -Ilib -Iexamples/lib t/portable-transport-smoke.t
          $portableStatus = $LASTEXITCODE
          if ($portableStatus -ne 0) { throw "Checkout transport smoke failed: $portableStatus" }
          # Retain the previously observed checkout pipe probe until the native
          # Perl replacement has succeeded on this runner.
          pwsh -NoProfile -File .github/scripts/test-windows-pipe.ps1 `
            -PerlPath (Get-Command perl).Source `
            -RunnerPath (Join-Path $PWD 'bin/perl-slim') `
            -Perl5Lib ((Join-Path $PWD 'lib') + ';' + (Join-Path $PWD 'examples/lib'))
          $status = $LASTEXITCODE
          if ($status -ne 0) { throw "Existing checkout pipe probe failed: $status" }

      - name: Run focused Perl and TCP tests
        shell: pwsh
        run: |
          Write-Host 'The Perl pipe test polls IPC::Open3 pipes with IO::Select, which Windows select does not support. The equivalent real-child wire check ran with bounded .NET asynchronous pipe reads in the previous step.'
          $failed = @()
          foreach ($test in @('t/00-load.t', 't/list-serializer.t', 't/typed-sequence-converters.t', 't/server-concurrency.t', 't/server-bind-address.t')) {
            Write-Host "Running $test"
            prove --lib $test
            $status = $LASTEXITCODE
            if ($status -ne 0) {
              $failed += "$test (exit $status)"
              Write-Host "FAILED: $test (exit $status)"
            }
            else { Write-Host "PASSED: $test" }
          }
          if ($failed.Count -gt 0) { throw "Windows focused tests failed: $($failed -join ', ')" }

      - name: Install and smoke-test both installed transports
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'test-fitnesse-slim'
          perl Build.PL "--install_base=$prefix"
          if ($LASTEXITCODE -ne 0) { throw "Build.PL install configuration failed: $LASTEXITCODE" }
          perl Build
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }
          perl Build install
          if ($LASTEXITCODE -ne 0) { throw "Build install failed: $LASTEXITCODE" }
          $modulePath = Join-Path $prefix 'lib/perl5'
          $fixturePath = Join-Path $PWD 'examples/lib'
          $runner = Join-Path $prefix 'bin/perl-slim'
          perl "-I$modulePath" "-I$fixturePath" t/portable-transport-smoke.t `
            --runner $runner --module-dir $modulePath --fixture-dir $fixturePath `
            --install-prefix $prefix
          $status = $LASTEXITCODE
          if ($status -ne 0) { throw "Installed pipe/TCP smoke failed: $status" }
